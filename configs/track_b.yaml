# Track B — Conformer-CTC ASR on the RVQ₁ stream. SKELETON ONLY (implemented Phase 1).
# All hyperparameters below are PROVISIONAL pending the 100% pilot; they are then
# frozen for every subset run — no per-subset tuning, ever (PROTOCOL.md rule 2).
track: asr_ctc

model:
  # PROVISIONAL
  input_stream: 0                 # RVQ₁ = tensor dim-0 index 0 (semantic layer)
  d_model: 256
  n_conformer_layers: 4           # allowed range 4–6; pick once from pilot
  n_conformer_heads: 4
  conformer_ff_mult: 4
  conv_kernel_size: 15
  dropout: 0.1

training:
  # PROVISIONAL
  batch_size: 32                  # utterances, full-sequence training (no crops)
  lr_peak: 5.0e-4
  warmup_steps: 2000              # PROVISIONAL — revisit at pilot
  weight_decay: 1.0e-6
  label_smoothing: 0.0
  n_epochs: null                  # set per-run by the equal-epochs protocol driver

augment:
  # Fixed SpecAugment-style masking on the token stream (locked across all runs)
  freq_mask_n: 2                  # masks over RVQ stream axis (applied to embedded features)
  freq_mask_width: 12
  time_mask_n: 2
  time_mask_ratio_max: 0.15       # fraction of T per mask

decode:
  greedy: true                    # no external LM, ever
  lm_weight: 0.0

logging:
  grad_norm_log_every_batches: 50   # gradient L2 norms per batch
  ckpt_every_epochs: 5              # feeds LESS trajectories later
  eval_metric: wer                  # jiwer WER on frozen internal val
