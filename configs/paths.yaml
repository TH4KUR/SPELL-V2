# Filesystem layout — Ada cluster revision (supersedes the NAS write-through
# block; see PROTOCOL.md §5). Relative paths resolve against the repo root.
# On Ada the repo lives at $HOME/spell, so relative paths land at $HOME/spell/*.
dataset_root: datasets/LRS3         # env override: SPELL_DATA_ROOT
                                    # (on Ada, staged data lives at data/ = $HOME/spell/data)
subsets_dir: subsets
index_path: data_index.parquet      # produced by scripts/audit_data.py
splits_dir: subsets/splits          # frozen internal split lists (committed)
runs_dir: runs                      # per-run bundles: ckpts + metrics.parquet (<=~20 files)

# Archive (RELAY-LOCKED): compute nodes NEVER touch /share1 (mounts vary per
# node; verified unreachable). Runs bundle in runs_dir; scripts/drain_runs.sh
# moves bundles to archive_root from a node where /share1 is mounted.
archive_mode: relay                 # LOCKED to relay by protocol revision; 'direct' rejected
archive_root: /share1/NAS/spell-rq2 # env override: SPELL_ARCHIVE_ROOT

# $HOME quota gates (/home: 30G + 300k inodes on Ada) — usage thresholds.
home_warn_gb: 20                    # warn when $HOME usage exceeds this
home_abort_gb: 23                   # abort (strict mode / pre-launch gate) above this
inode_warn_k: 240                   # warn at this many inodes in $HOME (quota 300k)
